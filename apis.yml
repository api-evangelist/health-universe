aid: health-universe
name: Health Universe
description: >-
  Health Universe is an enterprise healthcare AI platform and compliant app
  cloud that lets clinical, research, and life-sciences teams build, deploy,
  govern, and monitor AI agents inside regulated environments. Developers
  package Python models as Streamlit, FastAPI, React, or Agent2Agent (A2A) apps
  and ship them with one click to a HIPAA-aligned, SOC 2 Type II, ONC-certified,
  TEFCA-connected workspace. The platform unifies patient records via TEFCA and
  SMART on FHIR, and provides Navigator, Explorer/Roster, and Observer surfaces
  for deploying agents, building cohorts, and monitoring cost, hallucination,
  and high-risk scenarios with human-in-the-loop review. Health Universe ships a
  first-party CLI (@health-universe/cli), a Python SDK, and an A2A agent SDK.
  Backed by Kleiner Perkins.
